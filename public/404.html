<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Страницата не е намерена | StayFlow</title>
    <meta name="description" content="Този адрес не съществува в StayFlow." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: #f6efe3;
        color: #241a11;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        line-height: 1.5;
        text-align: center;
      }
      main { max-width: 28rem; }
      img { display: block; margin: 0 auto 24px; height: auto; }
      .code { margin: 0; color: #a63e1e; font-size: 56px; font-weight: 700; line-height: 1; }
      h1 { margin: 12px 0 0; font-size: 22px; }
      p { margin: 8px 0 0; color: #4a3b2d; font-size: 16px; }
      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 24px; }
      a.btn {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        padding: 0 20px;
        border-radius: 10px;
        font-weight: 600;
        text-decoration: none;
      }
      a.primary { background: #a63e1e; color: #fff; }
      a.secondary { background: #f8e2d6; color: #7a2c12; }
      a.btn:focus-visible { outline: 3px solid #241a11; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/logo-horizontal.png" alt="StayFlow" width="180" height="39" />
      <p class="code" aria-hidden="true">404</p>
      <h1>Страницата не е намерена</h1>
      <p>Адресът може да е изписан неточно или страницата вече да не съществува.</p>
      <div class="actions">
        <a class="btn primary" href="/">Към началото</a>
        <a class="btn secondary" href="/demo">Разгледайте демото</a>
      </div>
    </main>
  </body>
</html>
