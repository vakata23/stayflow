# Защитни заглавия. Пълна Content-Security-Policy не е включена нарочно: приложението зарежда Supabase, карти и
# снимки от външни адреси и твърда политика без внимателна проверка би счупила страници. frame-ancestors е безопасна.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    Permissions-Policy = "camera=(), microphone=(), payment=(), geolocation=(self)"

# Вътрешни и лични страници не трябва да се появяват в търсачките.
[[headers]]
  for = "/guest/*"
  [headers.values]
    X-Robots-Tag = "noindex"

