[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Дублира config.schedule от самия функционен файл — някои бундлъри/версии
# на Netlify Functions четат разписанието само от netlify.toml, не от
# export const config вътре във файла. Безопасно е да стоят и двете.
[functions."process-outbox-scheduled"]
  schedule = "*/5 * * * *"

# API endpoint-ите трябва да се хванат ПРЕДИ SPA fallback-а —
# правилата се обхождат отгоре надолу и първото съвпадение печели.
[[redirects]]
  from = "/api/ical"
  to = "/.netlify/functions/ical"
  status = 200

[[redirects]]
  from = "/api/booking-request"
  to = "/.netlify/functions/booking-request"
  status = 200

[[redirects]]
  from = "/api/process-outbox"
  to = "/.netlify/functions/process-outbox"
  status = 200

[[redirects]]
  from = "/api/telegram-webhook"
  to = "/.netlify/functions/telegram-webhook"
  status = 200

# SPA fallback — react-router поема всички останали пътища.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
